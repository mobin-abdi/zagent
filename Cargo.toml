[package]
name = "zagent"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
ratatui = "0.29"
crossterm = "0.28"
pulldown-cmark = "0.12"
dotenvy = "0.15.7"
clap = { version = "4.6.6", features = ["derive"] }