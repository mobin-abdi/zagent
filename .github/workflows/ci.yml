name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --release


  release:
    name: Build Release
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # -------------------------
      # Dependencies
      # -------------------------

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            fakeroot \
            mingw-w64 \
            libfuse2

      # -------------------------
      # Linux
      # -------------------------

      - name: Build Linux binary
        run: cargo build --release

      # -------------------------
      # DEB
      # -------------------------

      - name: Build DEB package
        run: |
          rm -rf deb
          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/bin

          cp target/release/zagent deb/usr/bin/zagent

          cat > deb/DEBIAN/control <<EOF
          Package: zagent
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ZAgent
          Description: Lightweight AI agent written in Rust
          EOF

          chmod 755 deb/usr/bin/zagent

          dpkg-deb --build \
            deb \
            zagent-linux-x86_64.deb

      # -------------------------
      # APPIMAGE
      # -------------------------


      # -------------------------
      # WINDOWS
      # -------------------------

      - name: Setup Windows target
        run: |
          rustup target add x86_64-pc-windows-gnu

      - name: Build Windows binary
        run: |
          cargo build \
            --release \
            --target x86_64-pc-windows-gnu

          cp \
            target/x86_64-pc-windows-gnu/release/zagent.exe \
            zagent-windows-x86_64.exe

      # -------------------------
      # Checksums
      # -------------------------

      - name: Generate SHA256 checksums
        run: |
          sha256sum \
            zagent-linux-x86_64.deb \
            zagent-windows-x86_64.exe \
            > SHA256SUMS

      # -------------------------
      # GitHub Release
      # -------------------------

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: true
          generate_release_notes: false
          files: |
            zagent-linux-x86_64.deb
            zagent-windows-x86_64.exe
            SHA256SUMS
