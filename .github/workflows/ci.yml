name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --release

      - name: Prepare release
        run: |
          mkdir -p release

          cp target/release/zagent \
            release/zagent-linux-x86_64

      - name: Build DEB
        run: |
          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/bin

          cp target/release/zagent deb/usr/bin/zagent

          cat > deb/DEBIAN/control <<EOF
          Package: zagent
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ZAgent
          Description: Lightweight AI agent written in Rust
          EOF

          chmod 755 deb/usr/bin/zagent
          dpkg-deb --build deb release/zagent-linux-x86_64.deb

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin

          cp target/release/zagent AppDir/usr/bin/zagent

          cat > AppDir/zagent.desktop <<'EOF'
          [Desktop Entry]
          Name=ZAgent
          Comment=Lightweight AI agent written in Rust
          Exec=zagent
          Terminal=true
          Type=Application
          Categories=Development;
          EOF

          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

          ./appimagetool AppDir \
            release/zagent-linux-x86_64.AppImage

      - name: Setup Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build Windows
        run: |
          cargo build \
            --release \
            --target x86_64-pc-windows-gnu

          cp \
            target/x86_64-pc-windows-gnu/release/zagent.exe \
            release/zagent-windows-x86_64.exe

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS

      - name: Create/Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: true
          files: |
            release/zagent-linux-x86_64.deb
            release/zagent-linux-x86_64.AppImage
            release/zagent-windows-x86_64.exe
            release/SHA256SUMS
