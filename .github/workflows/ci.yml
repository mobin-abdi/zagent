name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --release


  release:
    name: Build Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            fakeroot \
            libfuse2

      - name: Build Linux binary
        run: cargo build --release

      # -------------------------
      # DEB
      # -------------------------

      - name: Build DEB package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/bin

          cp target/release/zagent deb/usr/bin/zagent

          cat > deb/DEBIAN/control <<EOF
          Package: zagent
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ZAgent
          Description: Lightweight AI agent written in Rust
          EOF

          chmod 755 deb/usr/bin/zagent

          dpkg-deb --build deb \
            "zagent-linux-x86_64.deb"

      # -------------------------
      # APPIMAGE
      # -------------------------

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin

          cp target/release/zagent AppDir/usr/bin/zagent

          cat > AppDir/zagent.desktop <<'EOF'
          [Desktop Entry]
          Name=ZAgent
          Comment=Lightweight AI agent written in Rust
          Exec=zagent
          Terminal=true
          Type=Application
          Categories=Development;
          EOF

          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

          ./appimagetool AppDir \
            zagent-linux-x86_64.AppImage

      # -------------------------
      # WINDOWS
      # -------------------------

      - name: Setup Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build Windows
        run: |
          cargo build \
            --release \
            --target x86_64-pc-windows-gnu

          cp \
            target/x86_64-pc-windows-gnu/release/zagent.exe \
            zagent-windows-x86_64.exe

      # -------------------------
      # CHECKSUMS
      # -------------------------

      - name: Generate checksums
        run: |
          sha256sum \
            zagent-linux-x86_64.deb \
            zagent-linux-x86_64.AppImage \
            zagent-windows-x86_64.exe \
            > SHA256SUMS

      # -------------------------
      # GITHUB RELEASE
      # -------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zagent-linux-x86_64.deb
            zagent-linux-x86_64.AppImage
            zagent-windows-x86_64.exe
            SHA256SUMS
